<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>事前ドーピング指令</title>
<style>
  :root {
    --bg: #0d0f14;
    --panel: #171a22;
    --border: #2a2f3a;
    --accent: #ff5f56;
    --accent2: #ffd23f;
    --text: #e8e8ea;
    --muted: #9aa0ab;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic", -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  .app {
    width: 100%;
    max-width: 520px;
  }
  h1 {
    font-size: 20px;
    letter-spacing: 0.05em;
    text-align: center;
    margin: 0 0 4px;
    color: var(--accent2);
  }
  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 24px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .menu-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: #1e222c;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 16px;
    border-radius: 10px;
    font-size: 15px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.1s;
  }
  .menu-btn:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  .menu-btn:last-child { margin-bottom: 0; }
  .menu-btn .label { color: var(--accent2); font-weight: bold; margin-right: 8px; }
  .quest-text {
    font-size: 16px;
    line-height: 1.7;
    border-left: 3px solid var(--accent);
    padding: 12px 16px;
    background: #1a1d26;
    border-radius: 6px;
    white-space: pre-wrap;
  }
  .actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }
  .btn {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
  }
  .btn-done { background: var(--accent2); color: #1a1400; }
  .btn-skip { background: #3a2020; color: #ffb3b3; border: 1px solid #6b3030; }
  .result {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 8px;
    font-size: 15px;
    line-height: 1.6;
  }
  .result.success { background: #1c2b1c; color: #b7f0b0; border: 1px solid #2f5a2f; }
  .result.slack { background: #2b1c1c; color: #f0b0b0; border: 1px solid #5a2f2f; }
  .back-btn {
    margin-top: 20px;
    width: 100%;
    padding: 10px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    cursor: pointer;
  }
  input[type="text"] {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #1e222c;
    color: var(--text);
    font-size: 14px;
    margin-bottom: 10px;
  }
  .note {
    color: var(--muted);
    font-size: 12px;
    margin-top: 24px;
    text-align: center;
    line-height: 1.6;
  }
  .dashboard {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #1a1d26;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 16px;
    font-size: 13px;
  }
  .dashboard .rank {
    color: var(--accent2);
    font-weight: bold;
    font-size: 14px;
  }
  .dashboard .count {
    color: var(--muted);
  }
</style>
</head>
<body>
<div class="app">
  <h1>事前ドーピング指令</h1>
  <div class="subtitle">先入れ指令システム</div>

  <div class="dashboard">
    <span class="rank" id="rank-label">新兵</span>
    <span class="count" id="count-label">ミッション成功 0回</span>
  </div>

  <div class="panel" id="menu-panel">
    <button class="menu-btn" onclick="startCalendarFlow()"><span class="label">[1]</span>予定から出撃</button>
    <button class="menu-btn" onclick="issueQuest('drinking')"><span class="label">[2]</span>今から飲み会</button>
    <button class="menu-btn" onclick="issueQuest('dining')"><span class="label">[3]</span>今から外食</button>
    <button class="menu-btn" onclick="issueQuest('lastMinute')"><span class="label">[4]</span>超直前(もう店にいる)</button>
  </div>

  <div class="panel" id="calendar-input-panel" style="display:none;">
    <label style="font-size:13px; color:var(--muted);">これから向かう予定の名前は?</label>
    <input type="text" id="event-name-input" placeholder="例: 取引先との会食">
    <button class="menu-btn" style="margin:0;" onclick="submitEventName()">指令を出す</button>
  </div>

  <div class="panel" id="quest-panel" style="display:none;">
    <div class="quest-text" id="quest-text"></div>
    <div class="actions" id="quest-actions">
      <button class="btn btn-done" onclick="completeQuest(true)">やった</button>
      <button class="btn btn-skip" onclick="completeQuest(false)">サボる</button>
    </div>
    <div class="result" id="result" style="display:none;"></div>
    <button class="back-btn" onclick="resetToMenu()">メニューに戻る</button>
  </div>

  <div class="note">ボタンを押すたびに文言はランダムで変わります</div>
</div>

<script>
const CONBINI_MISSIONS = [
  { store: "セブンイレブン", item: "サラダチキンバー", action: "即食いせよ" },
  { store: "ファミリーマート", item: "サラダチキンバー", action: "1本流し込め" },
  { store: "ローソン", item: "飲むヨーグルト(無糖)", action: "一気に飲み干せ" },
  { store: "セブンイレブン", item: "ゆで卵2個", action: "殻を剥いて片付けろ" },
  { store: "ファミリーマート", item: "素焼きミックスナッツ", action: "一掴み片付けろ" },
  { store: "ローソン", item: "サラダチキン(プレーン)", action: "半分でいいから腹に入れろ" },
  { store: "セブンイレブン", item: "冷奴", action: "そのまま飲み込め" },
  { store: "ファミリーマート", item: "枝豆パック", action: "1袋片付けろ" },
  { store: "ローソン", item: "チーズ(6Pタイプ)", action: "2個食っておけ" },
  { store: "セブンイレブン", item: "野菜ジュース(コップ1杯分)", action: "一気に飲み干せ" }
];

const LAST_MINUTE_MISSIONS = [
  "最初の乾杯はハイボールかウーロン茶を選べ、ビールは2杯目からにしておけ",
  "お通しのキャベツか枝豆を先に片付けろ、箸はそこから動かせ",
  "生ビール1杯目は半分まで飲んだら一旦グラスを置け",
  "揚げ物に箸をつける前に、冷奴か枝豆を1品頼んでおけ",
  "ライスは真っ先に頼むな、野菜系を1品挟んでからにしろ"
];

const DRINKING_MISSIONS = [
  "【緊急指令】居酒屋の気配を検知! {store}の『{item}』を{action}。血糖値の暴走を阻止せよ。",
  "【出撃前補給】乾杯の号令がかかる前に、{store}で『{item}』を確保、{action}。",
  "【警報】丸腰で突入すれば、ビール1杯目で血糖値がジェットコースターになるぞ。{store}の『{item}』を{action}。"
];

const DINING_MISSIONS = [
  "【単独任務】今から外食だな? {store}で『{item}』を確保し、{action}。",
  "【偵察指令】ラーメンの誘惑に対抗するため、{store}の『{item}』を{action}。",
  "【最終警告】大盛りに挑む前に、{store}の『{item}』を{action}。"
];

const CALENDAR_MISSIONS = [
  "【時限指令】『{event}』開始まで秒読みだ。{store}で『{item}』を確保、{action}。",
  "【予告指令】まもなく『{event}』が始まる。突入前に{store}の『{item}』を{action}。",
  "【予定確認】『{event}』、逃げも隠れもできないな? せめて{store}で『{item}』を{action}。"
];

const SUCCESS_LINES = [
  "ナイス前線基地補給! これで血糖値の暴走は防いだ。",
  "ミッション完了! 今日のアルコール吸収力、50%ダウンだ(※イメージです)。",
  "補給完了、部隊は万全だ。心置きなく前線(飲み会)へ向かえ。"
];

const SLACK_LINES = [
  "まあそんな日もある。せめて1杯目はハイボールにしておけ。",
  "無念の戦死……明日の朝、水1Lで回復を図れ。",
  "補給なしの突撃か。健闘を祈るが、被害担当は自分自身だぞ。"
];

const RANKS = [
  { threshold: 10, name: "鉄壁の胃袋" },
  { threshold: 4, name: "血糖値ディフェンダー" },
  { threshold: 1, name: "見習いガードマン" },
  { threshold: 0, name: "新兵" }
];

const PROGRESS_KEY = "preDopingSuccessCount";

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function fillTemplate(template, vars) {
  return template.replace(/\{(\w+)\}/g, (_, key) => vars[key]);
}

function buildMission(templateList, extra) {
  const mission = pick(CONBINI_MISSIONS);
  return fillTemplate(pick(templateList), Object.assign({}, mission, extra || {}));
}

function rankFor(count) {
  for (const r of RANKS) {
    if (count >= r.threshold) return r.name;
  }
  return RANKS[RANKS.length - 1].name;
}

function loadSuccessCount() {
  try {
    return parseInt(localStorage.getItem(PROGRESS_KEY), 10) || 0;
  } catch (e) {
    return 0;
  }
}

function saveSuccessCount(count) {
  try {
    localStorage.setItem(PROGRESS_KEY, String(count));
  } catch (e) {
    // 保存できない環境(プライベートブラウジング等)ではダッシュボード表示のみ更新
  }
}

function refreshDashboard() {
  const count = loadSuccessCount();
  document.getElementById("rank-label").textContent = rankFor(count);
  document.getElementById("count-label").textContent = `ミッション成功 ${count}回`;
}

function showPanel(id) {
  ["menu-panel", "calendar-input-panel", "quest-panel"].forEach(p => {
    document.getElementById(p).style.display = (p === id) ? "block" : "none";
  });
}

function issueQuest(kind, eventName) {
  let text;
  if (kind === "drinking") {
    text = buildMission(DRINKING_MISSIONS);
  } else if (kind === "dining") {
    text = buildMission(DINING_MISSIONS);
  } else if (kind === "lastMinute") {
    text = "【超直前指令】" + pick(LAST_MINUTE_MISSIONS);
  } else {
    text = buildMission(CALENDAR_MISSIONS, { event: eventName });
  }
  document.getElementById("quest-text").textContent = text;
  document.getElementById("quest-actions").style.display = "flex";
  document.getElementById("result").style.display = "none";
  showPanel("quest-panel");
}

function startCalendarFlow() {
  showPanel("calendar-input-panel");
  document.getElementById("event-name-input").value = "";
  document.getElementById("event-name-input").focus();
}

function submitEventName() {
  const name = document.getElementById("event-name-input").value.trim() || "謎の予定";
  issueQuest("calendar", name);
}

function completeQuest(done) {
  const result = document.getElementById("result");
  result.style.display = "block";
  if (done) {
    const count = loadSuccessCount() + 1;
    saveSuccessCount(count);
    refreshDashboard();
    result.className = "result success";
    result.textContent = `${pick(SUCCESS_LINES)}\n(称号: ${rankFor(count)} / ミッション成功 ${count}回)`;
  } else {
    result.className = "result slack";
    result.textContent = pick(SLACK_LINES);
  }
  document.getElementById("quest-actions").style.display = "none";
}

function resetToMenu() {
  showPanel("menu-panel");
}

refreshDashboard();
</script>
</body>
</html>
