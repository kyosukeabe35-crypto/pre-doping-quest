<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>暴飲暴食防止システム:サキタベ</title>
<style>
  :root {
    --bg: #000000;
    --panel: #0a0a0a;
    --border: #4a3510;
    --accent: #ff6a00;
    --accent2: #ffb300;
    --alert: #ff2222;
    --text: #e8dfc8;
    --muted: #6b6250;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Courier New", "MS Gothic", "Osaka-Mono", monospace;
    display: flex;
    justify-content: center;
    padding: 0 0 32px;
  }
  .hazard-bar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 8px;
    background: repeating-linear-gradient(
      -45deg,
      var(--accent),
      var(--accent) 10px,
      #000 10px,
      #000 20px
    );
    z-index: 10;
  }
  .app {
    width: 100%;
    max-width: 520px;
    padding: 28px 16px 0;
  }
  h1 {
    font-size: 18px;
    letter-spacing: 0.08em;
    text-align: center;
    margin: 0 0 4px;
    color: var(--accent2);
    text-shadow: 0 0 6px rgba(255,179,0,0.35);
  }
  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.15em;
    margin-bottom: 24px;
  }
  .subtitle::before, .subtitle::after {
    content: "◆";
    color: var(--accent);
    margin: 0 6px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 0;
    padding: 20px;
    margin-bottom: 16px;
    position: relative;
  }
  .panel::before, .panel::after {
    content: "";
    position: absolute;
    width: 10px;
    height: 10px;
    border: 2px solid var(--accent);
  }
  .panel::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .panel::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }
  .menu-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: #111;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 16px;
    border-radius: 0;
    font-size: 14px;
    font-family: inherit;
    letter-spacing: 0.03em;
    margin-bottom: 12px;
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .menu-btn:hover {
    border-color: var(--accent);
    box-shadow: 0 0 8px rgba(255,106,0,0.4) inset;
  }
  .menu-btn:last-child { margin-bottom: 0; }
  .menu-btn .label { color: var(--accent); font-weight: bold; margin-right: 8px; }
  .quest-text {
    font-size: 15px;
    line-height: 1.8;
    border-left: 3px solid var(--alert);
    padding: 12px 16px;
    background: #140a0a;
    border-radius: 0;
    white-space: pre-wrap;
  }
  .actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }
  .btn {
    flex: 1;
    padding: 12px;
    border-radius: 0;
    border: 1px solid var(--border);
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 0.1em;
    font-weight: bold;
    cursor: pointer;
  }
  .btn-done { background: var(--accent2); color: #1a0f00; border-color: var(--accent2); }
  .btn-skip { background: #1a0000; color: #ff8888; border-color: #7a1a1a; }
  .result {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 0;
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
    border: 1px solid;
  }
  .result.success { background: #0a1408; color: #9dffb0; border-color: #2f5a2f; }
  .result.slack { background: #140505; color: #ff9d9d; border-color: #7a2f2f; }
  .back-btn {
    margin-top: 20px;
    width: 100%;
    padding: 10px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: inherit;
    letter-spacing: 0.1em;
    border-radius: 0;
    cursor: pointer;
  }
  input[type="text"] {
    width: 100%;
    padding: 10px;
    border-radius: 0;
    border: 1px solid var(--border);
    background: #111;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    margin-bottom: 10px;
  }
  .note {
    color: var(--muted);
    font-size: 11px;
    margin-top: 24px;
    text-align: center;
    line-height: 1.6;
    letter-spacing: 0.05em;
  }
  .dashboard {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #111;
    border: 1px solid var(--accent);
    padding: 12px 16px;
    margin-bottom: 16px;
    font-size: 12px;
  }
  .dashboard .rank {
    color: var(--accent2);
    font-weight: bold;
    font-size: 13px;
    letter-spacing: 0.05em;
  }
  .dashboard .count {
    color: var(--muted);
  }
</style>
</head>
<body>
<div class="hazard-bar"></div>
<div class="app">
  <h1>暴飲暴食防止システム:サキタベ</h1>
  <div class="subtitle">腹部脂肪防衛システム起動</div>

  <div class="dashboard">
    <span class="rank" id="rank-label">同調率 0% ― 未起動</span>
    <span class="count" id="count-label">防衛成功 0回</span>
  </div>

  <div class="panel" id="menu-panel">
    <button class="menu-btn" onclick="startCalendarFlow()"><span class="label">[1]</span>予定から出撃</button>
    <button class="menu-btn" onclick="issueQuest('drinking')"><span class="label">[2]</span>今から飲み会</button>
    <button class="menu-btn" onclick="issueQuest('dining')"><span class="label">[3]</span>今から外食</button>
    <button class="menu-btn" onclick="issueQuest('lastMinute')"><span class="label">[4]</span>超直前(もう店にいる)</button>
  </div>

  <div class="panel" id="calendar-input-panel" style="display:none;">
    <label style="font-size:12px; color:var(--muted); letter-spacing:0.05em;">これから向かう予定の名前は?</label>
    <input type="text" id="event-name-input" placeholder="例: 取引先との会食">
    <button class="menu-btn" style="margin:0;" onclick="submitEventName()">指令を出す</button>
  </div>

  <div class="panel" id="quest-panel" style="display:none;">
    <div class="quest-text" id="quest-text"></div>
    <div class="actions" id="quest-actions">
      <button class="btn btn-done" onclick="completeQuest(true)">やった</button>
      <button class="btn btn-skip" onclick="completeQuest(false)">サボる</button>
    </div>
    <div class="result" id="result" style="display:none;"></div>
    <button class="back-btn" onclick="resetToMenu()">メニューに戻る</button>
  </div>

  <div class="note">ボタンを押すたびに指令内容はランダムで変わります</div>
</div>

<script>
const CONBINI_MISSIONS = [
  { store: "セブンイレブン", item: "サラダチキンバー", action: "即食いせよ" },
  { store: "ファミリーマート", item: "サラダチキンバー", action: "1本流し込め" },
  { store: "ローソン", item: "飲むヨーグルト(無糖)", action: "一気に飲み干せ" },
  { store: "セブンイレブン", item: "ゆで卵2個", action: "殻を剥いて片付けろ" },
  { store: "ファミリーマート", item: "素焼きミックスナッツ", action: "一掴み片付けろ" },
  { store: "ローソン", item: "サラダチキン(プレーン)", action: "半分でいいから腹に入れろ" },
  { store: "セブンイレブン", item: "冷奴", action: "そのまま飲み込め" },
  { store: "ファミリーマート", item: "枝豆パック", action: "1袋片付けろ" },
  { store: "ローソン", item: "チーズ(6Pタイプ)", action: "2個食っておけ" },
  { store: "セブンイレブン", item: "野菜ジュース(コップ1杯分)", action: "一気に飲み干せ" }
];

const LAST_MINUTE_MISSIONS = [
  "最初の乾杯はハイボールかウーロン茶を選べ、ビールは2杯目からにしておけ",
  "お通しのキャベツか枝豆を先に片付けろ、箸はそこから動かせ",
  "生ビール1杯目は半分まで飲んだら一旦グラスを置け",
  "揚げ物に箸をつける前に、冷奴か枝豆を1品頼んでおけ",
  "ライスは真っ先に頼むな、野菜系を1品挟んでからにしろ"
];

const DRINKING_MISSIONS = [
  "【警戒レベル1】腹部脂肪反応を検知。{store}の『{item}』を{action}。血糖値の暴走を阻止せよ。",
  "【第一種防衛態勢】乾杯の号令がかかる前に、{store}で『{item}』を確保、{action}。",
  "【警報】丸腰で突入すれば、ビール1杯目で血糖値が制御不能になるぞ。{store}の『{item}』を{action}。"
];

const DINING_MISSIONS = [
  "【単独出撃任務】今から外食だな? {store}で『{item}』を確保し、{action}。",
  "【偵察指令】ラーメンの誘惑に対抗するため、{store}の『{item}』を{action}。",
  "【最終警告】大盛りに挑む前に、{store}の『{item}』を{action}。"
];

const CALENDAR_MISSIONS = [
  "【時限指令】『{event}』開始まで秒読みだ。{store}で『{item}』を確保、{action}。",
  "【予告指令】まもなく『{event}』が始まる。突入前に{store}の『{item}』を{action}。",
  "【予定確認】『{event}』、回避は不可能だ。せめて{store}で『{item}』を{action}。"
];

const SUCCESS_LINES = [
  "防衛成功。腹部脂肪の増殖係数を抑制した。",
  "任務完了。本日のアルコール吸収係数、50%減少だ(※イメージです)。",
  "防衛システム安定。心置きなく前線(飲み会)へ向かえ。"
];

const SLACK_LINES = [
  "まあそんな日もある。せめて1杯目はハイボールにしておけ。",
  "防衛失敗……明日の朝、水1Lで回復を図れ。",
  "無防備な突入か。健闘を祈るが、被害担当は自分自身だぞ。"
];

const RANKS = [
  { threshold: 10, label: "同調率 100% ― 完全防衛態勢" },
  { threshold: 4, label: "同調率 65% ― 防衛安定" },
  { threshold: 1, label: "同調率 30% ― 初期起動" },
  { threshold: 0, label: "同調率 0% ― 未起動" }
];

const PROGRESS_KEY = "abFatDefenseSuccessCount";

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function fillTemplate(template, vars) {
  return template.replace(/\{(\w+)\}/g, (_, key) => vars[key]);
}

function buildMission(templateList, extra) {
  const mission = pick(CONBINI_MISSIONS);
  return fillTemplate(pick(templateList), Object.assign({}, mission, extra || {}));
}

function rankFor(count) {
  for (const r of RANKS) {
    if (count >= r.threshold) return r.label;
  }
  return RANKS[RANKS.length - 1].label;
}

function loadSuccessCount() {
  try {
    return parseInt(localStorage.getItem(PROGRESS_KEY), 10) || 0;
  } catch (e) {
    return 0;
  }
}

function saveSuccessCount(count) {
  try {
    localStorage.setItem(PROGRESS_KEY, String(count));
  } catch (e) {
    // 保存できない環境(プライベートブラウジング等)ではダッシュボード表示のみ更新
  }
}

function refreshDashboard() {
  const count = loadSuccessCount();
  document.getElementById("rank-label").textContent = rankFor(count);
  document.getElementById("count-label").textContent = `防衛成功 ${count}回`;
}

function showPanel(id) {
  ["menu-panel", "calendar-input-panel", "quest-panel"].forEach(p => {
    document.getElementById(p).style.display = (p === id) ? "block" : "none";
  });
}

function issueQuest(kind, eventName) {
  let text;
  if (kind === "drinking") {
    text = buildMission(DRINKING_MISSIONS);
  } else if (kind === "dining") {
    text = buildMission(DINING_MISSIONS);
  } else if (kind === "lastMinute") {
    text = "【接近戦モード】" + pick(LAST_MINUTE_MISSIONS);
  } else {
    text = buildMission(CALENDAR_MISSIONS, { event: eventName });
  }
  document.getElementById("quest-text").textContent = text;
  document.getElementById("quest-actions").style.display = "flex";
  document.getElementById("result").style.display = "none";
  showPanel("quest-panel");
}

function startCalendarFlow() {
  showPanel("calendar-input-panel");
  document.getElementById("event-name-input").value = "";
  document.getElementById("event-name-input").focus();
}

function submitEventName() {
  const name = document.getElementById("event-name-input").value.trim() || "謎の予定";
  issueQuest("calendar", name);
}

function completeQuest(done) {
  const result = document.getElementById("result");
  result.style.display = "block";
  if (done) {
    const count = loadSuccessCount() + 1;
    saveSuccessCount(count);
    refreshDashboard();
    result.className = "result success";
    result.textContent = `${pick(SUCCESS_LINES)}\n(${rankFor(count)} / 防衛成功 ${count}回)`;
  } else {
    result.className = "result slack";
    result.textContent = pick(SLACK_LINES);
  }
  document.getElementById("quest-actions").style.display = "none";
}

function resetToMenu() {
  showPanel("menu-panel");
}

refreshDashboard();
</script>
</body>
</html>
